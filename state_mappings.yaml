# =============================================================================
# State Name Mappings — India Crime Intelligence Platform v1.3
# =============================================================================
# Externalized version of state_mapping.py. Edit this file to add new state
# name variants without touching Python code.
#
# Usage: state_mapping.py loads this YAML if present, falls back to hardcoded
# values otherwise.
# =============================================================================

# ── Raw-to-Canonical Mapping ────────────────────────────────────────────────
# Maps every observed state/UT name variant (UPPERCASED) to canonical form.
# Before lookup: upper().strip().replace('"', '')
# States that already match canonical after uppercasing are NOT listed.

state_name_map:
  # Andaman & Nicobar Islands
  "A & N ISLANDS": "ANDAMAN & NICOBAR ISLANDS"
  "A&N ISLANDS": "ANDAMAN & NICOBAR ISLANDS"
  "ANDAMAN & NICOBAR": "ANDAMAN & NICOBAR ISLANDS"
  "ANDAMAN AND NICOBAR": "ANDAMAN & NICOBAR ISLANDS"
  "ANDAMAN AND NICOBAR ISLANDS": "ANDAMAN & NICOBAR ISLANDS"

  # Dadra & Nagar Haveli
  "D & N HAVELI": "DADRA & NAGAR HAVELI"
  "D&N HAVELI": "DADRA & NAGAR HAVELI"
  "DADRA AND NAGAR HAVELI": "DADRA & NAGAR HAVELI"

  # Daman & Diu
  "DAMAN AND DIU": "DAMAN & DIU"

  # Delhi
  "DELHI UT": "DELHI"
  "NCT OF DELHI": "DELHI"

  # Jammu & Kashmir
  "JAMMU AND KASHMIR": "JAMMU & KASHMIR"

  # Odisha
  "ORISSA": "ODISHA"

  # Puducherry
  "PONDICHERRY": "PUDUCHERRY"

  # Uttarakhand
  "UTTARANCHAL": "UTTARAKHAND"

  # Chhattisgarh
  "CHATTISGARH": "CHHATTISGARH"

  # Post-2019 additions (for future data)
  "THE DADRA AND NAGAR HAVELI AND DAMAN AND DIU": "DADRA & NAGAR HAVELI"
  "DNH AND DD": "DADRA & NAGAR HAVELI"
  "DNH & DD": "DADRA & NAGAR HAVELI"


