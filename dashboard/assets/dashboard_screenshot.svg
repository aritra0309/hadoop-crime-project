  <text x="70" y="95" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#66706a">Interactive dashboard preview</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5a2d00" font-weight="700">
